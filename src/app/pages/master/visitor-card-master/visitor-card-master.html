<!-- TABLE SECTION -->
<div class="p-4" *ngIf="showTableData">
  <div class="flex flex-wrap items-center justify-between rounded-sm gap-4 mb-4 px-3 ">
    <h2 class="text-xl font-semibold">Visitor Card List</h2>

    <div class="flex flex-wrap items-center gap-4 ml-auto">
      <!-- Search box -->
      <div
        class="flex items-center rounded-full overflow-hidden border border-gray-300 bg-white shadow-sm focus-within:border-blue-200 focus-within:ring-1 focus-within:ring-red-100 transition">
        <input
          matInput
          class="px-4 py-2 border-0 outline-none focus:outline-none focus:ring-0 text-sm w-64"
          placeholder="Search..."
          (keyup)="applyFilter($event)"/>
        <button
          mat-icon-button
          class="h-full flex items-center justify-center px-3 hover:bg-gray-100">
          <mat-icon class="text-gray-500 text-base">search</mat-icon>
        </button>
      </div>

      <button
        type="button"
        class="bg-[#005177] hover:bg-[#003e5c] text-white font-medium py-2 px-5 rounded-lg normal-case shadow-md transition-all duration-200 flex items-center justify-center export-btn"
        (click)="addnew()">
        Add New
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="border border-gray-200 rounded-md overflow-hidden">
    <div class="max-h-80 overflow-y-auto">
      <table mat-table [dataSource]="dataSource" class="w-full text-sm">
        <!-- Sr No Column -->
        <ng-container matColumnDef="Srno">
          <th mat-header-cell *matHeaderCellDef class="font-semibold sticky top-0 bg-white z-10">Sr No.</th>
          <td mat-cell *matCellDef="let element; let i = index">
            {{ (pageIndex * pageSize) + i + 1 }}
          </td>
        </ng-container>

        <!-- Visitor Card Number Column -->
        <ng-container matColumnDef="visitorCardNumber">
          <th mat-header-cell *matHeaderCellDef class="font-semibold sticky top-0 bg-white z-10">
            Visitor Card Number
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.visitorCardNumber }}
          </td>
        </ng-container>

        <!-- Action Column -->
        <ng-container matColumnDef="action">
          <th
            mat-header-cell
            *matHeaderCellDef
            class="font-semibold sticky top-0 bg-white z-10 action-header"
          >
            Action
          </th>

          <td mat-cell *matCellDef="let row" class="action-cell">
            <div class="action-buttons">
              <button mat-icon-button class="edit-btn" (click)="editData(row.visitorCardId)">
                <mat-icon>edit</mat-icon>
              </button>

              <button mat-icon-button class="delete-btn" (click)="delete(row.visitorCardId)">
                <mat-icon>delete</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <!-- Header & Row -->
        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </div>

    <!-- Paginator -->
    <div class="flex items-center justify-end px-4 py-2 text-xs text-gray-600">
      <mat-paginator
        [pageSize]="pageSize"
        [pageSizeOptions]="[10,20,30]"
        (page)="onPageChange($event)">
      </mat-paginator>
    </div>
  </div>
</div>


<!-- FORM SECTION -->
<div class="p-4" *ngIf="showFormData">

  <div class="flex flex-wrap items-center justify-between rounded-sm gap-4 mb-4 px-3">
    <h2 class="text-xl font-semibold">Add Visitor Card</h2>

    <div class="flex flex-wrap items-center gap-4 ml-auto">
      <button
        type="button"
        (click)="backtoList()"
        class="group inline-flex items-center gap-2 rounded-lg border border-blue-200 bg-white px-5 py-2 text-sm font-semibold text-blue-600 shadow-sm transition-all duration-200 hover:border-blue-500 hover:bg-blue-50 hover:text-blue-700 hover:shadow-md active:scale-95"
      >
        <img
          src="/assets/images/emojione-monotone_left-arrow.png"
          alt="Back"
          class="h-5 w-5 transition-transform duration-200 group-hover:-translate-x-1"
        />
        <span>Go Back to List</span>
      </button>
    </div>
  </div>

  <div class="p-4 md:p-6 bg-white rounded-lg shadow-sm border border-gray-100 max-w-6xl mx-auto">
    <form [formGroup]="form" class="space-y-6">

      <div class="grid grid-cols-1 md:grid-cols-3 gap-4">

        <div>
          <label class="block text-sm font-medium text-[#004A71] mb-1">
            Visitor Card Number <span class="text-red-500">*</span>
          </label>

          <input
            type="text"
            formControlName="visitorCardNumber"
            placeholder="Enter here..."
            class="w-full px-3 py-2 border border-sky-500 rounded-md focus:outline-none focus:ring-1 focus:ring-sky-500 focus:border-sky-500 text-sm"
          />

          <p
            class="text-red-500 text-xs mt-1"
            *ngIf="form.get('visitorCardNumber')?.hasError('required') && form.get('visitorCardNumber')?.touched"
          >
            Visitor Card Number is required
          </p>
        </div>

      </div>

      <div class="flex items-center justify-start gap-3 pt-4 border-t border-gray-100">

        @if (!isEditMode) {
          <button
            mat-stroked-button
            type="submit"
            (click)="onSubmit()"
            class="btn-save px-6 py-2 rounded-md font-semibold"
          >
            Save
          </button>
        }

        @if (isEditMode) {
          <button
            mat-stroked-button
            type="submit"
            (click)="onUpdate()"
            class="btn-save px-6 py-2 rounded-md font-semibold"
          >
            Update
          </button>
        }

        <button
          mat-raised-button
          type="button"
          class="btn-cancel px-6 py-2 rounded-md"
          (click)="onCancel()">
          Cancel
        </button>
      </div>

    </form>
  </div>
</div>
